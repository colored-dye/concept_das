train:
  model_name: "microsoft/Phi-3.5-mini-instruct"
  component: "res"
  seed: 42
  use_bf16: true
  source_tokens: "<|assistant|>"
  do_overwrite_vector: true  # do not concat weights to saved ones
  models:
    PDASVector:
      batch_size: 16
      gradient_accumulation_steps: 1
      n_epochs: 20
      lr: 0.02
      weight_decay: 0.00
      low_rank_dimension: 1
      intervention_positions: "all"
      intervention_type: "subspace" # clamping
      binarize_dataset: false
      exclude_bos: true
      loss_type: "scaled_simpo"
      # loss_type: "dpo"
      beta: 1.0
      gemma: 0.0
      simpo_scaler: 1.0
      label_smoothing: 0.0
inference:
  use_bf16: true
  models: ["PDASVector"]
  model_name: "microsoft/Phi-3.5-mini-instruct"
  # latent related params
  output_length: 128
  latent_num_of_examples: 36
  latent_batch_size: 16
  # steering related params
  steering_intervention_type: "clamping" # clamping
  steering_model_name: "microsoft/Phi-3.5-mini-instruct"
  steering_datasets: ["AlpacaEval"]
  steering_batch_size: 10
  steering_output_length: 128
  steering_layers: []
  steering_num_of_examples: 100 # number of examples per concept and per factor
  steering_factors: [1.0] # number of steering factors per example
  # master data dir is shared across all jobs.
  master_data_dir: "./data"
  seed: 42
  lm_model: "gpt-4o-mini"
  # generation related params
  temperature: 0.0
evaluate:
  models: ["PDASVector"]
  latent_evaluators: []
  steering_evaluators: []
  winrate_split_ratio: 0.5 # this is for steering only, we use a separate partition for factor selection.
  # Number of processes to run in parallel for steering evaluation.
  num_of_workers: 32
  lm_model: "gpt-4o-mini"
  run_winrate: false
  winrate_baseline: "PromptSteering"
  # master data dir is shared across all jobs.
  master_data_dir: "axbench/data"
