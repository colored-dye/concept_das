[tool.poetry]
name = "cdas"
version = "0.1.0"
description = "Concept Distributed Alignment Search."
packages = [{ include = "cdas" }]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10,<4.0"
torch = ">=2.2.0"
numpy = "<2.0"
datasets = "<4.0.0"
transformers = ">=4.46.2,<5.0"
accelerate = ">=1.1"
tqdm = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
